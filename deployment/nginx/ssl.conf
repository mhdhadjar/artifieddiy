server {
  listen 80 default_server;
  server_name _;

  location /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 444;
  }
}

server {
  listen 80;
  server_name artifieddiy.com www.artifieddiy.com api.artifieddiy.com admin.artifieddiy.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name artifieddiy.com www.artifieddiy.com;

  ssl_certificate /etc/letsencrypt/live/artifieddiy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artifieddiy.com/privkey.pem;

  location / {
    set $upstream http://website:2202;
    proxy_pass $upstream;
    include /opt/nginx/proxy-params.conf;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.artifieddiy.com;
  client_max_body_size 110m;
  client_body_timeout 300s;

  ssl_certificate /etc/letsencrypt/live/artifieddiy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artifieddiy.com/privkey.pem;

  location / {
    set $upstream http://api:2201;
    proxy_pass $upstream;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    include /opt/nginx/proxy-params.conf;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.artifieddiy.com;

  ssl_certificate /etc/letsencrypt/live/artifieddiy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artifieddiy.com/privkey.pem;

  location / {
    set $upstream http://admin:2203;
    proxy_pass $upstream;
    include /opt/nginx/proxy-params.conf;
  }
}
