# yaml-language-server: $schema=schemas/compose-spec.json
services:
  mongo:
    ports:
      - "27017:27017"

  api:
    build:
      target: dev
    ports:
      - "2201:2201"
    volumes:
      - ../api:/app
      - api_node_modules:/app/node_modules
      - uploads:/data/uploads
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run start:dev

  website:
    build:
      target: dev
    ports:
      - "2202:2202"
    volumes:
      - ../website:/app
      - website_node_modules:/app/node_modules
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:2201}
      NEXT_PUBLIC_ADMIN_URL: ${ADMIN_ORIGIN:-http://localhost:2203}
      NEXT_PUBLIC_SITE_URL: ${WEB_ORIGIN:-http://localhost:2202}
    command: npm run dev

  admin:
    build:
      target: dev
    ports:
      - "2203:2203"
    volumes:
      - ../admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:2201}
      VITE_WEB_URL: ${WEB_ORIGIN:-http://localhost:2202}
    command: npm run dev

volumes:
  api_node_modules:
  website_node_modules:
  admin_node_modules:
