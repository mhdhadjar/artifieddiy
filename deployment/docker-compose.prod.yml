# yaml-language-server: $schema=schemas/compose-spec.json
services:
  api:
    build:
      target: prod
    restart: unless-stopped

  website:
    build:
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_ORIGIN:?set ADMIN_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${WEB_ORIGIN:?set WEB_ORIGIN}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:2201

  admin:
    build:
      target: prod
      args:
        VITE_API_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL}
        VITE_WEB_URL: ${WEB_ORIGIN:?set WEB_ORIGIN}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http.conf:/opt/nginx/http.conf:ro
      - ./nginx/ssl.conf:/opt/nginx/ssl.conf:ro
      - ./nginx/proxy-params.conf:/opt/nginx/proxy-params.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      - api
      - website
      - admin

  certbot:
    image: certbot/certbot:v3
    restart: unless-stopped
    volumes:
      - ./nginx/certbot.sh:/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?set CERTBOT_EMAIL}
    entrypoint: ["/bin/sh", "/certbot.sh"]
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  letsencrypt:
  certbot_www:
